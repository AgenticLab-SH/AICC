name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - if: runner.os != 'Windows'
        run: bash -n install.sh
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: npm run test:account-manager

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject personal defaults and runtime state
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '/Users/[A-Za-z0-9._-]+|C:\\Users\\[A-Za-z0-9._-]+|[A-Za-z0-9._%+-]+@gmail\.com' -- ':!vendor/opencodex/**' ':!test/**' ':!tests/**' ':!**/test/**' ':!**/tests/**'; then
            echo 'Personal path or email found in publishable source.' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(auth\.json|\.env|.*\.sqlite(-shm|-wal)?|.*\.db|.*\.pem|.*\.key|credentials\.json)$'; then
            echo 'Runtime credential or database file is tracked.' >&2
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
