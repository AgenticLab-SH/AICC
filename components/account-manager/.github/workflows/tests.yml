name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Verifies the tool imports and passes tests on every supported OS,
    # since path handling differs across macOS, Windows and Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest tests -q
      - name: Import check
        run: python -c "import sys; sys.path.insert(0, 'src'); import codex_multi, cm_integrations, codex_thread_index"
      # Guards the documented install path: if packaging breaks, `uv tool install`
      # from GitHub breaks too, and that failure should surface here.
      - name: Install from source and run the entry point
        run: |
          python -m pip install .
          cm setup --check
        shell: bash
