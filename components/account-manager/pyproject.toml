[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-account-manager"
version = "0.1.0"
description = "Manage multiple ChatGPT/Codex accounts on one machine: switch the desktop app account, run isolated CLI sessions per account, and track quota in one table."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sanghoon Kim" }]
keywords = ["codex", "chatgpt", "cli", "accounts", "quota"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Runtime is stdlib only, so an install can never break on a transitive
# dependency. `tomllib` is why 3.11 is the floor.
dependencies = []

[project.urls]
Homepage = "https://github.com/AgenticLab-SH/ai-control-center"
Issues = "https://github.com/AgenticLab-SH/ai-control-center/issues"
Documentation = "https://github.com/AgenticLab-SH/ai-control-center/tree/main/components/account-manager/docs"
"Development with Codex" = "https://github.com/AgenticLab-SH/ai-control-center/blob/main/components/account-manager/docs/developed-with-codex.md"

[project.scripts]
cm = "codex_multi:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

# The modules are flat files rather than a package, so list them explicitly.
# `src` is the import root; the console script resolves `codex_multi:main`.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
  "config.example.toml",
]
